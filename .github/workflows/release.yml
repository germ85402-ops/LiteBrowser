name: Release

on:
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch:
    inputs:
      tag:
        description: 'Existing tag to publish, e.g. v0.2.0'
        required: true

permissions:
  contents: write

jobs:
  release:
    if: github.event_name != 'push' || startsWith(github.ref, 'refs/tags/') || contains(github.event.head_commit.message, '[prerelease]')
    runs-on: ubuntu-24.04
    env:
      TAG: ${{ github.event.inputs.tag || github.ref_name }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ env.TAG }}
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v6
        with:
          cache-provider: basic

      - name: Resolve release tag
        env:
          INPUT_TAG: ${{ github.event.inputs.tag }}
        run: |
          if [ -n "$INPUT_TAG" ]; then
            tag="$INPUT_TAG"
          elif [ "$GITHUB_REF_TYPE" = "tag" ]; then
            tag="$GITHUB_REF_NAME"
          else
            version=$(sed -n 's/.*versionName = "\(.*\)".*/\1/p' app/build.gradle.kts)
            tag="v$version"
          fi
          echo "TAG=$tag" >> "$GITHUB_ENV"

      - name: Check tag matches versionName
        run: |
          version=$(sed -n 's/.*versionName = "\(.*\)".*/\1/p' app/build.gradle.kts)
          if [ "v$version" != "$TAG" ]; then
            echo "::error::Tag $TAG does not match versionName $version in app/build.gradle.kts"; exit 1
          fi

      - name: Restore release key
        env:
          KEYSTORE_BASE64: ${{ secrets.SVETLO_KEYSTORE_BASE64 }}
          SVETLO_STORE_PASSWORD: ${{ secrets.SVETLO_STORE_PASSWORD }}
          SVETLO_KEY_ALIAS: ${{ secrets.SVETLO_KEY_ALIAS }}
          SVETLO_KEY_PASSWORD: ${{ secrets.SVETLO_KEY_PASSWORD }}
        run: |
          if [ -z "$KEYSTORE_BASE64" ] || [ -z "$SVETLO_STORE_PASSWORD" ] || [ -z "$SVETLO_KEY_ALIAS" ] || [ -z "$SVETLO_KEY_PASSWORD" ]; then
            echo "::error::Release signing secrets are missing. Run scripts/create-release-key.sh (see docs/RELEASE.md)."; exit 1
          fi
          # Re-encode PKCS12 with algorithms readable by JDK 17, preserving key and certificate.
          # Some newer OpenSSL exports use PBES2 parameters that Java's reader rejects.
          umask 077
          trap 'rm -f "$RUNNER_TEMP/release-source.p12" "$RUNNER_TEMP/release-compatible.p12" "$RUNNER_TEMP/release.pem"' EXIT
          echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/release-source.p12"
          openssl pkcs12 -in "$RUNNER_TEMP/release-source.p12" -passin env:SVETLO_STORE_PASSWORD -out "$RUNNER_TEMP/release.pem" -nodes
          openssl pkcs12 -export -in "$RUNNER_TEMP/release.pem" -out "$RUNNER_TEMP/release-compatible.p12" -passout env:SVETLO_STORE_PASSWORD -name "$SVETLO_KEY_ALIAS" -keypbe PBE-SHA1-3DES -certpbe PBE-SHA1-3DES -macalg sha1
          keytool -importkeystore -srckeystore "$RUNNER_TEMP/release-compatible.p12" -srcstoretype PKCS12 -srcstorepass:env SVETLO_STORE_PASSWORD -srcalias "$SVETLO_KEY_ALIAS" -destkeystore "$RUNNER_TEMP/release.jks" -deststoretype JKS -deststorepass:env SVETLO_STORE_PASSWORD -destkeypass:env SVETLO_KEY_PASSWORD -destalias "$SVETLO_KEY_ALIAS" -noprompt
          echo "SVETLO_KEYSTORE=$RUNNER_TEMP/release.jks" >> "$GITHUB_ENV"

      - name: Test and build
        env:
          SVETLO_STORE_PASSWORD: ${{ secrets.SVETLO_STORE_PASSWORD }}
          SVETLO_KEY_ALIAS: ${{ secrets.SVETLO_KEY_ALIAS }}
          SVETLO_KEY_PASSWORD: ${{ secrets.SVETLO_KEY_PASSWORD }}
        run: ./gradlew testDebugUnitTest assembleRelease --console=plain

      - name: Verify signature and package
        run: |
          apksigner=$(ls "$ANDROID_HOME"/build-tools/*/apksigner | sort -V | tail -1)
          "$apksigner" verify --print-certs app/build/outputs/apk/release/app-release.apk | tee certs.txt
          if grep -q "CN=Android Debug" certs.txt; then echo "::error::APK is debug-signed"; exit 1; fi
          mkdir dist
          cp app/build/outputs/apk/release/app-release.apk "dist/Svetlo-$TAG.apk"
          (cd dist && sha256sum "Svetlo-$TAG.apk" > "Svetlo-$TAG.apk.sha256")
          rm -f "$RUNNER_TEMP/release.jks"

      - name: Save signed APK as workflow artifact
        uses: actions/upload-artifact@v7
        with:
          name: Svetlo-${{ env.TAG }}-release
          path: dist/*
          if-no-files-found: error
          retention-days: 30

      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          prerelease=""
          case "$TAG" in *-*) prerelease="--prerelease";; esac
          notes=$(awk -v v="## ${TAG#v}" '$0==v{f=1;next} /^## /{if(f)exit} f' CHANGELOG.md)
          [ -n "$notes" ] || notes="Svetlo $TAG"
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" dist/* --clobber
          else
            gh release create "$TAG" dist/* --title "Svetlo $TAG" --notes "$notes" $prerelease
          fi
