name: Build APK

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v6
      - name: Test and build
        run: ./gradlew testDebugUnitTest assembleRelease --console=plain
      - name: Capture interface screens
        run: ./gradlew testDebugUnitTest -Pscreenshots=true --tests '*ScreenshotTest*' --tests '*RobolectricTest*' --console=plain
      - uses: actions/upload-artifact@v7
        with:
          name: LiteBrowser-apk
          path: app/build/outputs/apk/release/app-release.apk
      - uses: actions/upload-artifact@v7
        with:
          name: Svetlo-interface-review
          path: app/build/screenshots/*.png
          if-no-files-found: error
          retention-days: 7
